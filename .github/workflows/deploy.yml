name: Build and Deploy Infra and React App (Multi-Env)

on:
  push:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore and Build Infra
        run: |
          dotnet restore infra/src/
          dotnet build infra/src/ --configuration Release

      - name: Upload Infra Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infra-build-artifacts
          path: infra/src/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build React App
        working-directory: app
        env: 
          NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
          VITE_AUTH0_DOMAIN: ${{ github.ref == 'refs/heads/main' && vars.VITE_AUTH0_PROD_DOMAIN || vars.VITE_AUTH0_DEV_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ github.ref == 'refs/heads/main' && vars.VITE_AUTH0_PROD_CLIENT_ID || vars.VITE_AUTH0_DEV_CLIENT_ID }}
        
        run: |
          npm ci
          npm install
          npm run build:${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Upload React Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build-artifacts
          path: app/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # Required so GitHub can issue an OIDC token that AWS will trust
    permissions:
      id-token: write
      contents: read

    env:
      ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      AWS_REGION: us-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ('sub','aud','repository','ref')},indent=2))" "$TOKEN"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.AWS_PROD_ROLE_ARN || vars.AWS_DEV_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      # Bootstrap is a one-time setup per account/region, done by you with your own
      # login; the pipeline role isn't allowed to do it. This step only checks that
      # it has been done, and fails fast with instructions if not.
      - name: Verify CDK Bootstrap
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if ! VERSION=$(aws ssm get-parameter \
                --name /cdk-bootstrap/hnb659fds/version \
                --query Parameter.Value --output text 2>/dev/null); then
            echo "::error::CDK is not bootstrapped in $ACCOUNT/$AWS_REGION (or this role cannot read /cdk-bootstrap/hnb659fds/version)."
            echo "::error::Run once with admin credentials: cdk bootstrap aws://$ACCOUNT/$AWS_REGION"
            exit 1
          fi
          echo "CDK bootstrap found in $ACCOUNT/$AWS_REGION (version $VERSION)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Download Infra Artifacts
        uses: actions/download-artifact@v4
        with:
          name: infra-build-artifacts
          path: infra/src/

      - name: Download React Artifacts
        uses: actions/download-artifact@v4
        with:
          name: react-build-artifacts
          path: app/dist/

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      # Account comes from the assumed role's credentials (CDK_DEFAULT_ACCOUNT).
      - name: Deploy Infrastructure with CDK
        run: |
          cd infra/
          cdk deploy --all \
            --require-approval never \
            --context env=${{ env.ENV_NAME }}